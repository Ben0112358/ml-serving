[tool.poetry]
name = "ml-serving"
version = "0.1.0"
description = ""
authors = ["Ben0112358"]
readme = "README.md"

packages = [
  { include = "ml_serving", from = "src" }
]


[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = ">=0.116.1,<0.142.0"
pydantic = ">=2.11.7,<3.0.0"
pyyaml = ">=6.0.2,<7.0.0"
uvicorn = ">=0.35.0,<0.54.0"
urllib3 = ">=2.7.0,<3.0.0"
python-multipart = ">=0.0.30,<0.0.33"
numpy = ">=2.3.1,<3.0.0"
scikit-learn = ">=1.7.0,<2.0.0"
pandas = ">=2.3.1,<4.0.0"
cloudpickle = "^3.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
flake8 = "^7.3.0"
black = "^26.3.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.pytest.ini_options]
pythonpath = ["src"]
