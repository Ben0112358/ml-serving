name: Grok repo housekeeping

on:
  schedule:
    # One UTC day in three. A day-of-month step bunches runs at month boundaries.
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Housekeeping mode
        required: true
        type: choice
        options: [security, docs, errors, dependencies, style, tests]

permissions: {}

concurrency:
  group: grok-repo-housekeeping
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pick mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_MODE" ]; then
              echo "No housekeeping mode for this event"
              exit 1
            fi
            echo "Selected mode: $INPUT_MODE"
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          day=$(( $(date -u +%s) / 86400 ))
          if [ $(( day % 3 )) -ne 0 ]; then
            echo "Not a housekeeping day, skipping."
            exit 0
          fi
          modes=(security docs errors dependencies style tests)
          mode="${modes[$(( (day / 3) % 6 ))]}"
          echo "Selected mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Call Grok housekeeper
        if: ${{ steps.mode.outputs.mode != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.GROK_HOUSEKEEPER_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.GROK_HOUSEKEEPER_WEBHOOK_AUTH }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.mode.outputs.mode }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_AUTH" ]; then
            echo "Housekeeper webhook secrets are not set."
            exit 1
          fi
          payload=$(jq -nc \
            --arg repo "$REPO" \
            --arg mode "$MODE" \
            --arg sha "$SHA" \
            --arg event "$EVENT" \
            '{repo:$repo, mode:$mode, sha:$sha, event:$event}')
          curl -sS --fail-with-body \
            --retry 3 --retry-delay 15 \
            --max-time 30 --retry-max-time 120 \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: $WEBHOOK_AUTH" \
            -d "$payload"
